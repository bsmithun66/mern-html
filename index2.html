<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Traffic Light</title>
    <style>
        body {
            margin: left 50px;
            justify-content: left;  
            min-height: 70vh;
            display: flex;
            background:whitesmoke;
            font-family: Arial, sans-serif;
        }
        .traffic-light {
            width: 140px;
            padding: 40px;
            background: #222;
            border-radius: 24px;
            text-align: center;
        }
        .light {
            width: 100px;
            height: 100px;
            margin: 12px auto;
            border-radius: 50%;
            background: #444;
            
            
        }
        .red {
            background: #ff3b3b;
        }
        .yellow {
            background: #f2d600;
        }
        .green {
            background: #34c759;
        }


    </style>
</head>
<body>
    <div>
        <div class="traffic-light">
            <div class="light red"></div>
            
            <div class="light yellow"></div>
            
            <div class="light green"></div>
            
        </div>
    </div>
</body>
</html>
